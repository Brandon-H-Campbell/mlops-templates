name: tf-gha-install-terraform.yml
 
on:
  workflow_call:
    inputs:
      TFAction:
        type: string
        description: 'Terraform Action- Apply or Destroy'   
        required: true
        default: 'apply'
      dply_environment:
        type: string
        required: true 
      location:
        description: 'Location'
        type: string
        required: true
      namespace:
        description: 'Namespace'
        type: string
        required: true
      postfix:
        description: 'postfix'
        type: string
        required: true
      environment:
        description: 'Enviroment of the AML workspace'
        type: string
        required: true
      enable_aml_computecluster:
        description: 'Boolean to decide whether to deploy an AML compute cluster or not'
        type: boolean
        required: true
      enable_monitoring:
        description: 'Boolean to decide whether to enable monitoring'
        type: boolean
        required: true
      terraform_version:
        description: 'Terraform version'
        type: string
        required: true
      terraform_workingdir:
        description: 'Terraform State working directory'
        type: string
        required: true
      terraform_st_location:
        description: 'Location of terraform state resources'
        type: string
        required: true
      terraform_st_storage_account: 
        type: string
        description: 'name of the terraform state storage account to create'
        required: true
      terraform_st_resource_group: 
        type: string
        description: 'name of the terraform resource group to host the terraform state resources'
        required: true
      terraform_st_container_name: 
        type: string
        description: 'name of the terraform state container'
        required: true 
      terraform_st_key:
        type: string
        description: 'name of the terraform state key'
        required: true
      terraform_plan_location:
        type: string
        description: 'location of Terraform plan'
        required: true
      terraform_plan_vnet:
        type: string
        description: 'vnet of Terraform plan'
        required: true
      terraform_upgrade:
        type: boolean
        description: 'Run terraform init with -upgrade to update provider plugins'
        required: false
        default: false
    secrets:
      AZURE_CREDENTIALS:
        required: true
      clientId:
        required: true
      clientSecret:
        required: true
      tenantId:
        required: true
      subscriptionId:
        required: true        
jobs:
  create-tfstate-resources:
    name: Create Resources for Terraform State
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
    - name: azure-login
      uses: azure/login@v2
      with:
        # Secret is passed in by caller workflow via: secrets: AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
        # Inside this reusable workflow it is available as secrets.AZURE_CREDENTIALS
        creds: ${{ secrets.AZURE_CREDENTIALS }}
        enable-AzPSSession: false
    - name: create-tfstate-resource-group
      run: |
        az group create --location "${{ inputs.terraform_st_location }}" --name "${{ inputs.terraform_st_resource_group }}" --only-show-errors
        echo "Resource group ensured: ${{ inputs.terraform_st_resource_group }}"
    - name: validate-azure-env
      run: |
        set -e
        for v in ARM_CLIENT_ID ARM_CLIENT_SECRET ARM_SUBSCRIPTION_ID ARM_TENANT_ID; do
          if [ -z "${!v}" ]; then
            echo "::error title=Missing secret::Environment variable $v is empty. Ensure secrets are passed from the caller workflow using 'secrets:' mapping.";
            exit 1
          fi
        done
        az account show >/dev/null || { echo "::error::Azure CLI not authenticated"; exit 1; }
        echo "Azure authentication validated; subscription: $(az account show --query id -o tsv)"
      env:
        ARM_CLIENT_ID: ${{ secrets.clientId }}
        ARM_CLIENT_SECRET: ${{ secrets.clientSecret }}
        ARM_SUBSCRIPTION_ID: ${{ secrets.subscriptionId }}
        ARM_TENANT_ID: ${{ secrets.tenantId }}
    - name: create-tfstate-storage-account
      run: |
        if ! az storage account show -n "${{ inputs.terraform_st_storage_account }}" -g "${{ inputs.terraform_st_resource_group }}" &>/dev/null; then
          az storage account create \
            -n "${{ inputs.terraform_st_storage_account }}" \
            -g "${{ inputs.terraform_st_resource_group }}" \
            -l "${{ inputs.terraform_st_location }}" \
            --sku Standard_LRS --kind StorageV2 --allow-blob-public-access false --only-show-errors
          echo "Storage account created: ${{ inputs.terraform_st_storage_account }}"
        else
          echo "Storage account already exists, skipping create."
        fi
    - name: create-tfstate-storage-container
      run: |
        # Use Azure AD auth; requires SP to have at least 'Storage Blob Data Contributor' on the storage account or RG.
        if ! az storage container show --name "${{ inputs.terraform_st_container_name }}" --account-name "${{ inputs.terraform_st_storage_account }}" --auth-mode login &>/dev/null; then
          az storage container create --name "${{ inputs.terraform_st_container_name }}" --account-name "${{ inputs.terraform_st_storage_account }}" --auth-mode login --only-show-errors
          echo "Container created: ${{ inputs.terraform_st_container_name }}"
        else
          echo "Container already exists, skipping create."
        fi
  install-terraform:
    name: 'Install Terraform'
    runs-on: ubuntu-latest
    needs: create-tfstate-resources
    environment: ${{ inputs.dply_environment }}
    defaults:
      run:
        shell: bash
    env:
      ARM_CLIENT_ID: ${{ secrets.clientId }}
      ARM_CLIENT_SECRET: ${{ secrets.clientSecret }}
      ARM_SUBSCRIPTION_ID: ${{ secrets.subscriptionId }}
      ARM_TENANT_ID: ${{ secrets.tenantId }}
    steps:
    - name: checkout
      uses: actions/checkout@v3
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v2 
      with:
        terraform_version: ${{ inputs.terraform_version }}
    - name: Terraform Init
      run: |
        echo "Subscription: $ARM_SUBSCRIPTION_ID"
        # Initialize Terraform backend using Azure AD auth (no access keys / SAS) for state operations.
        # Requires that the service principal has 'Storage Blob Data Contributor' on the storage account.
        # 'use_azuread_auth=true' prevents Terraform from attempting key-based auth which is blocked by policy.
        if [ "${{ inputs.terraform_upgrade }}" = "true" ]; then
          echo "Running terraform init with -upgrade";
          UPGRADE_FLAG="-upgrade"
        else
          UPGRADE_FLAG=""
        fi
        terraform -chdir=${{ inputs.terraform_workingdir }} init $UPGRADE_FLAG \
          -backend-config="storage_account_name=${{ inputs.terraform_st_storage_account }}" \
          -backend-config="container_name=${{ inputs.terraform_st_container_name }}" \
          -backend-config="key=${{ inputs.terraform_st_key }}" \
          -backend-config="use_azuread_auth=true"
    - name: Terraform Validate
      run: terraform -chdir=${{ inputs.terraform_workingdir }} validate
    - name: Terraform Plan
      run: terraform -chdir=${{ inputs.terraform_workingdir }} plan -out=plan.tfplan -input=false -var "location=${{ inputs.terraform_plan_location }}" -var "prefix=${{ inputs.namespace }}" -var "postfix=${{ inputs.postfix }}" -var "environment=${{ inputs.environment }}" 
        -var "enable_aml_computecluster=${{ inputs.enable_aml_computecluster }}" -var "enable_monitoring=${{ inputs.enable_monitoring }}" -var "client_secret=${{ env.ARM_CLIENT_SECRET }}"
    - name: Terraform Apply
      if: ${{ inputs.TFAction == 'apply'}}  
      run: terraform -chdir=${{ inputs.terraform_workingdir }} apply -input=false -auto-approve plan.tfplan 
    - name: Terraform Destroy
      if: ${{ inputs.TFAction == 'destroy' }} 
      run: terraform -chdir=${{ inputs.terraform_workingdir }} destroy -input=false -auto-approve
