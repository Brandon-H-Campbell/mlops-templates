name: Azure Login Debug
on:
  workflow_dispatch: {}

jobs:
  debug-login:
    runs-on: ubuntu-latest
    steps:
      - name: Check that AZURE_CREDENTIALS exists
        run: |
          if [ -z "${{ secrets.AZURE_CREDENTIALS }}" ]; then
            echo "Missing required secret: AZURE_CREDENTIALS"
            exit 1
          fi

      - name: Show creds length (redacted)
        run: echo "${{ secrets.AZURE_CREDENTIALS }}" | wc -c

      - name: Azure Login (client secret JSON)
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Who am I?
        run: |
          set -e
          echo "Azure subscription context:"
          if ! az account show --only-show-errors -o table; then
            echo "Failed to show account"
            exit 1
          fi
          SUB_ID=$(az account show --query id -o tsv)
          TENANT_ID=$(az account show --query tenantId -o tsv)
          echo "Subscription ID: $SUB_ID"
          echo "Tenant ID: $TENANT_ID"
          echo "Listing first 5 resource groups (if any)..."
          az group list --query '[].name' -o tsv | head -n 5 || echo "(No resource groups or insufficient permissions)"
